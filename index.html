<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
  <meta name="description" content="Live weather dashboard with forecasts, radar and satellite maps" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>⛅ Weather Dashboard</h1>
      <div class="search-bar">
        <input id="cityInput" type="text" placeholder="Search city..." autocomplete="off" inputmode="search" />
        <button id="searchBtn" aria-label="Search">Search</button>
        <button id="locBtn" aria-label="Use my location">📍</button>
      </div>
    </header>

    <div id="error" class="error hidden"></div>
    <div id="loader" class="loader hidden"><span class="loader-dot"></span>Loading…</div>

    <main id="dashboard" class="hidden">

      <section class="current-card">
        <div class="current-left">
          <p id="cityName" class="city-name"></p>
          <p id="dateTime" class="date-time"></p>
          <div class="temp-row">
            <img id="weatherIcon" src="" alt="" loading="lazy" />
            <span id="temp" class="temp"></span>
          </div>
          <p id="description" class="description"></p>
        </div>
        <div class="current-right">
          <div class="stat"><span class="label">Feels Like</span><span id="feelsLike"></span></div>
          <div class="stat"><span class="label">Humidity</span><span id="humidity"></span></div>
          <div class="stat"><span class="label">Wind</span><span id="wind"></span></div>
          <div class="stat"><span class="label">Pressure</span><span id="pressure"></span></div>
          <div class="stat"><span class="label">Visibility</span><span id="visibility"></span></div>
          <div class="stat"><span class="label">UV Index</span><span id="uv"></span></div>
        </div>
      </section>

      <section class="chart-section">
        <h2>48-Hour Temperature Trend</h2>
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
        </div>
      </section>

      <section class="forecast-section">
        <h2>5-Day Forecast</h2>
        <div id="forecastCards" class="forecast-cards"></div>
      </section>

      <section class="map-section">
        <div class="map-header">
          <h2>Live Weather Map</h2>
          <div class="map-layers">
            <button class="layer-btn active" data-layer="rain">🌧 Rain Radar</button>
            <button class="layer-btn" data-layer="satellite">🛰 Satellite</button>
          </div>
        </div>
        <div id="mapTimeBar" class="map-time-bar"></div>
        <div id="weatherMap"></div>
      </section>

      <section class="hourly-section">
        <h2>Today's Hourly</h2>
        <div id="hourlyCards" class="hourly-cards"></div>
      </section>

    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
